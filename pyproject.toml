[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ptfree"
version = "2.0.6"
description = "M-Team unattended free-torrent downloader with local Chinese Web UI"
authors = [{name = "EddieForAI"}]
readme = "README-中文.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["cryptography>=50.0.2,<51"]

[project.scripts]
ptfree = "ptfree.__main__:main"
mtfree = "ptfree.__main__:main"

[tool.setuptools.package-data]
ptfree = ["static/*", "static/legal/*"]

[tool.setuptools.packages.find]
include = ["ptfree*"]
