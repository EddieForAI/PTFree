services:
  mtfree:
    image: ptfree-freeseed:2.0.6-synology
    build:
      context: .
      # args:
      #   PIP_INDEX_URL: https://mirrors.ustc.edu.cn/pypi/simple
    # 改成拥有 data 和 watch 两个目录的 DSM 用户的 UID:GID。
    user: "1026:100"
    restart: unless-stopped
    environment:
      MTFREE_WEB_PORT: "8787"
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
      - ./watch:/watch
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['MTFREE_WEB_PORT'] + '/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
